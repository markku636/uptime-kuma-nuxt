# =============================================================================
# Nuxt.js Uptime Kuma Cluster with OpenResty
# =============================================================================
# 參考 docker-compose-bun-cluster.yaml 架構，為 Nuxt.js 專案建立叢集配置
#
# Usage:
#   docker-compose -f docker-compose-cluster.yaml up -d --build
#
# Access:
#   http://localhost:32400/dashboard
#
# Node Management API:
#   GET  /api/cluster/nodes    - 取得所有節點狀態
#   GET  /api/cluster/current  - 取得當前節點
#   POST /api/cluster/switch   - 切換節點 {"node": "node1|node2|node3|node4|node5|auto"}
# =============================================================================

volumes:
  postgres_data:
    driver: local

networks:
  kuma-nuxt-network:
    driver: bridge

# 共用配置
x-app-common: &app-common
  image: nuxt-kuma-cluster:local
  restart: unless-stopped
  networks:
    - kuma-nuxt-network
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@db:5432/uptime_kuma?schema=public
    JWT_SECRET: your-secret-key-change-this-in-production
    NUXT_PUBLIC_APP_URL: http://localhost:32400
    NUXT_SESSION_PASSWORD: 2101fb00c0c04243a397cd43049a904e
  depends_on:
    db:
      condition: service_healthy

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: nuxt-kuma-postgres
    ports:
      - "32402:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime_kuma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuma-nuxt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # OpenResty Load Balancer / Reverse Proxy
  # ==========================================================================
  openresty:
    build:
      context: .
      dockerfile: nginx/Dockerfile.cluster
    image: nuxt-kuma-openresty-cluster:local
    container_name: nuxt-kuma-openresty
    restart: unless-stopped
    ports:
      - "32400:80"
    environment:
      # 節點配置 (JSON 格式)
      CLUSTER_NODES: |
        [
          {"id": "node1", "name": "Node 1", "host": "app1", "port": 3000},
          {"id": "node2", "name": "Node 2", "host": "app2", "port": 3000},
          {"id": "node3", "name": "Node 3", "host": "app3", "port": 3000},
          {"id": "node4", "name": "Node 4", "host": "app4", "port": 3000},
          {"id": "node5", "name": "Node 5", "host": "app5", "port": 3000}
        ]
      HEALTH_CHECK_INTERVAL: "10"
      HEALTH_CHECK_TIMEOUT: "5000"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - kuma-nuxt-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Nuxt.js Application Node 1 (Primary - Also builds the shared image)
  # ==========================================================================
  app1:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-kuma-app1
    volumes:
      - ./data/node1:/workspace/data
    ports:
      - "32411:3000"
    environment:
      <<: *app-env
      NODE_ID: node1
      NODE_NAME: "Node 1"
      IS_PRIMARY: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Nuxt.js Application Node 2
  # ==========================================================================
  app2:
    <<: *app-common
    container_name: nuxt-kuma-app2
    volumes:
      - ./data/node2:/workspace/data
    ports:
      - "32412:3000"
    environment:
      <<: *app-env
      NODE_ID: node2
      NODE_NAME: "Node 2"
    depends_on:
      db:
        condition: service_healthy
      app1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Nuxt.js Application Node 3
  # ==========================================================================
  app3:
    <<: *app-common
    container_name: nuxt-kuma-app3
    volumes:
      - ./data/node3:/workspace/data
    ports:
      - "32413:3000"
    environment:
      <<: *app-env
      NODE_ID: node3
      NODE_NAME: "Node 3"
    depends_on:
      db:
        condition: service_healthy
      app1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Nuxt.js Application Node 4
  # ==========================================================================
  app4:
    <<: *app-common
    container_name: nuxt-kuma-app4
    volumes:
      - ./data/node4:/workspace/data
    ports:
      - "32414:3000"
    environment:
      <<: *app-env
      NODE_ID: node4
      NODE_NAME: "Node 4"
    depends_on:
      db:
        condition: service_healthy
      app1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - extended

  # ==========================================================================
  # Nuxt.js Application Node 5
  # ==========================================================================
  app5:
    <<: *app-common
    container_name: nuxt-kuma-app5
    volumes:
      - ./data/node5:/workspace/data
    ports:
      - "32415:3000"
    environment:
      <<: *app-env
      NODE_ID: node5
      NODE_NAME: "Node 5"
    depends_on:
      db:
        condition: service_healthy
      app1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - extended
