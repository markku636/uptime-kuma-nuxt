# =============================================================================
# Nuxt.js Cluster OpenResty Configuration
# =============================================================================
# 支援動態節點路由、健康檢查、負載均衡的 OpenResty 配置
# =============================================================================

user root;
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 4096;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Docker 內建 DNS 解析器
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # WebSocket Connection header 處理
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" '
                    'upstream: $upstream_addr node: $cookie_selected_node rt: $request_time';

    log_format cluster '$remote_addr [$time_local] "$request" $status '
                       'node: $upstream_http_x_node_id rt: $request_time';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 共享記憶體區域 - 儲存節點狀態
    lua_shared_dict node_status 1m;
    lua_shared_dict user_node_mapping 10m;
    lua_shared_dict round_robin_counter 1k;

    # Lua 模組路徑
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    # 初始化節點狀態
    init_by_lua_block {
        local cluster_router = require "cluster_router"
        cluster_router.init()
    }

    # 定期健康檢查
    init_worker_by_lua_block {
        local cluster_router = require "cluster_router"
        
        -- 只在 worker 0 執行健康檢查
        if ngx.worker.id() == 0 then
            local function check_health()
                cluster_router.health_check()
            end
            
            local interval = tonumber(os.getenv("HEALTH_CHECK_INTERVAL")) or 10
            ngx.timer.every(interval, check_health)
            ngx.timer.at(0, check_health)
            ngx.log(ngx.INFO, "Health check worker started, interval: ", interval, "s")
        end
    }

    # ==========================================
    # 動態上游伺服器 (由 Lua 決定實際節點)
    # ==========================================
    upstream nuxt_cluster {
        server 127.0.0.1:1;  # dummy server，實際目標由 Lua 設定
        
        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local cluster_router = require "cluster_router"
            
            -- 使用在 access 階段預選的節點
            local host = ngx.ctx.target_host
            local port = ngx.ctx.target_port
            
            if not host or not port then
                ngx.log(ngx.ERR, "No target node selected")
                return ngx.exit(503)
            end
            
            ngx.log(ngx.DEBUG, "Balancer routing to: ", host, ":", port)
            
            local ok, err = balancer.set_current_peer(host, port)
            if not ok then
                ngx.log(ngx.ERR, "Failed to set upstream peer: ", err)
                return ngx.exit(502)
            end
        }
    }

    # ==========================================
    # 主要服務配置
    # ==========================================
    server {
        listen 80;
        server_name _;

        # ------------------------------------------
        # 叢集管理 API
        # ------------------------------------------
        
        # 取得所有節點狀態
        location = /api/cluster/nodes {
            content_by_lua_block {
                local cluster_router = require "cluster_router"
                local cjson = require "cjson"
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode(cluster_router.get_nodes()))
            }
        }
        
        # 取得當前節點
        location = /api/cluster/current {
            content_by_lua_block {
                local cluster_router = require "cluster_router"
                local cjson = require "cjson"
                
                local current_node = ngx.var.cookie_selected_node or "auto"
                local node_info = nil
                
                if current_node ~= "auto" then
                    node_info = cluster_router.get_node_by_id(current_node)
                end
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({
                    node = current_node,
                    mode = current_node == "auto" and "auto" or "manual",
                    nodeInfo = node_info
                }))
            }
        }
        
        # 切換節點
        location = /api/cluster/switch {
            content_by_lua_block {
                local cluster_router = require "cluster_router"
                local cjson = require "cjson"
                
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                local ok, data = pcall(cjson.decode, body)
                
                if not ok or not data or not data.node then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Invalid request. 'node' field required."}))
                    return
                end
                
                local target_node = data.node
                
                -- 驗證節點
                if target_node ~= "auto" then
                    local node = cluster_router.get_node_by_id(target_node)
                    if not node then
                        ngx.status = 400
                        ngx.say(cjson.encode({
                            error = "Invalid node. Use 'auto' or a valid node id.",
                            availableNodes = cluster_router.get_node_ids()
                        }))
                        return
                    end
                end
                
                -- 設定 Cookie
                if target_node == "auto" then
                    -- 清除 Cookie
                    ngx.header["Set-Cookie"] = "selected_node=; Path=/; Max-Age=0"
                else
                    -- 設定選擇的節點 (7天有效)
                    ngx.header["Set-Cookie"] = "selected_node=" .. target_node .. "; Path=/; Max-Age=604800"
                end
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({
                    success = true,
                    node = target_node,
                    message = target_node == "auto" and "Switched to auto mode" or "Switched to " .. target_node
                }))
            }
        }
        
        # 叢集統計資訊
        location = /api/cluster/stats {
            content_by_lua_block {
                local cluster_router = require "cluster_router"
                local cjson = require "cjson"
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode(cluster_router.get_stats()))
            }
        }

        # ------------------------------------------
        # 健康檢查端點
        # ------------------------------------------
        location = /health {
            access_log off;
            content_by_lua_block {
                local cluster_router = require "cluster_router"
                local healthy_count = cluster_router.get_healthy_count()
                
                if healthy_count > 0 then
                    ngx.status = 200
                    ngx.say("healthy - " .. healthy_count .. " nodes available")
                else
                    ngx.status = 503
                    ngx.say("unhealthy - no available nodes")
                end
            }
        }

        # ------------------------------------------
        # WebSocket / Socket.IO
        # ------------------------------------------
        location /socket.io/ {
            access_by_lua_block {
                local cluster_router = require "cluster_router"
                cluster_router.select_node()
            }
            
            proxy_pass http://nuxt_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 長連接超時
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------
        # 靜態資源 (Nuxt _nuxt 目錄) - 輪詢分發
        # ------------------------------------------
        location /_nuxt/ {
            access_by_lua_block {
                local cluster_router = require "cluster_router"
                cluster_router.select_node_round_robin()
            }
            
            proxy_pass http://nuxt_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------------------------------------------
        # API 請求
        # ------------------------------------------
        location /api/ {
            access_by_lua_block {
                local cluster_router = require "cluster_router"
                cluster_router.select_node()
            }
            
            header_filter_by_lua_block {
                -- 添加節點資訊到回應標頭
                if ngx.ctx.target_node_id then
                    ngx.header["X-Served-By"] = ngx.ctx.target_node_id
                end
            }
            
            proxy_pass http://nuxt_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Selected-Node $cookie_selected_node;
        }

        # ------------------------------------------
        # 預設路由 (所有其他請求)
        # ------------------------------------------
        location / {
            access_by_lua_block {
                local cluster_router = require "cluster_router"
                cluster_router.select_node()
            }
            
            header_filter_by_lua_block {
                if ngx.ctx.target_node_id then
                    ngx.header["X-Served-By"] = ngx.ctx.target_node_id
                end
            }
            
            proxy_pass http://nuxt_cluster;
            proxy_http_version 1.1;
            
            # WebSocket 支援 (for hot reload in dev)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Selected-Node $cookie_selected_node;
            
            # 超時設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }
    }
}
