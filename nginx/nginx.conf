user root;
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 4096;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Docker 內建 DNS 解析器
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # WebSocket Connection header 處理
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" '
                    'upstream: $upstream_addr node: $cookie_selected_node';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 共享記憶體區域 - 儲存節點狀態
    lua_shared_dict node_status 1m;
    lua_shared_dict user_node_mapping 10m;

    # 初始化節點狀態
    init_by_lua_block {
        local node_router = require "node_router"
        node_router.init()
    }

    # 定期健康檢查
    init_worker_by_lua_block {
        local node_router = require "node_router"
        
        -- 只在 worker 0 執行健康檢查
        if ngx.worker.id() == 0 then
            local function check_health()
                node_router.health_check()
            end
            ngx.timer.every(10, check_health)
            ngx.timer.at(0, check_health)
        end
    }

    # ==========================================
    # 上游伺服器配置
    # ==========================================
    
    upstream nuxt_node1 {
        server app1:3000;
        keepalive 32;
    }
    
    upstream nuxt_node2 {
        server app2:3000;
        keepalive 32;
    }
    
    upstream nuxt_node3 {
        server app3:3000;
        keepalive 32;
    }
    
    # 預設叢集 (輪詢)
    upstream nuxt_cluster {
        server app1:3000;
        server app2:3000;
        server app3:3000;
        keepalive 32;
    }

    # ==========================================
    # 主要服務配置
    # ==========================================
    server {
        listen 80;
        server_name _;

        # ------------------------------------------
        # 節點管理 API
        # ------------------------------------------
        
        # 取得所有節點狀態
        location /api/cluster/nodes {
            content_by_lua_block {
                local node_router = require "node_router"
                local cjson = require "cjson"
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode(node_router.get_nodes()))
            }
        }
        
        # 取得當前節點
        location /api/cluster/current {
            content_by_lua_block {
                local node_router = require "node_router"
                local cjson = require "cjson"
                
                local current_node = ngx.var.cookie_selected_node or "auto"
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({
                    node = current_node,
                    mode = current_node == "auto" and "auto" or "manual"
                }))
            }
        }
        
        # 切換節點
        location /api/cluster/switch {
            content_by_lua_block {
                local node_router = require "node_router"
                local cjson = require "cjson"
                
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                local ok, data = pcall(cjson.decode, body)
                
                if not ok or not data.node then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Invalid request. 'node' field required."}))
                    return
                end
                
                local target_node = data.node
                
                -- 驗證節點
                if target_node ~= "auto" and target_node ~= "node1" and target_node ~= "node2" and target_node ~= "node3" then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Invalid node. Use 'auto', 'node1', 'node2', or 'node3'."}))
                    return
                end
                
                -- 設定 Cookie
                if target_node == "auto" then
                    -- 清除 Cookie
                    ngx.header["Set-Cookie"] = "selected_node=; Path=/; Max-Age=0"
                else
                    -- 設定選擇的節點 (7天有效)
                    ngx.header["Set-Cookie"] = "selected_node=" .. target_node .. "; Path=/; Max-Age=604800"
                end
                
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({
                    success = true,
                    node = target_node,
                    message = target_node == "auto" and "Switched to auto mode" or "Switched to " .. target_node
                }))
            }
        }

        # ------------------------------------------
        # 健康檢查端點
        # ------------------------------------------
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------
        # WebSocket / Socket.IO
        # ------------------------------------------
        location /socket.io/ {
            # 根據 Cookie 選擇節點
            set $target_upstream "nuxt_cluster";
            
            access_by_lua_block {
                local selected = ngx.var.cookie_selected_node
                if selected == "node1" then
                    ngx.var.target_upstream = "nuxt_node1"
                elseif selected == "node2" then
                    ngx.var.target_upstream = "nuxt_node2"
                elseif selected == "node3" then
                    ngx.var.target_upstream = "nuxt_node3"
                end
            }
            
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 長連接超時
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------
        # 靜態資源 (Nuxt _nuxt 目錄)
        # ------------------------------------------
        location /_nuxt/ {
            proxy_pass http://nuxt_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------------------------------------------
        # API 請求
        # ------------------------------------------
        location /api/ {
            set $target_upstream "nuxt_cluster";
            
            access_by_lua_block {
                local selected = ngx.var.cookie_selected_node
                if selected == "node1" then
                    ngx.var.target_upstream = "nuxt_node1"
                elseif selected == "node2" then
                    ngx.var.target_upstream = "nuxt_node2"
                elseif selected == "node3" then
                    ngx.var.target_upstream = "nuxt_node3"
                end
            }
            
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Selected-Node $cookie_selected_node;
        }

        # ------------------------------------------
        # 預設路由 (所有其他請求)
        # ------------------------------------------
        location / {
            set $target_upstream "nuxt_cluster";
            
            access_by_lua_block {
                local selected = ngx.var.cookie_selected_node
                if selected == "node1" then
                    ngx.var.target_upstream = "nuxt_node1"
                elseif selected == "node2" then
                    ngx.var.target_upstream = "nuxt_node2"
                elseif selected == "node3" then
                    ngx.var.target_upstream = "nuxt_node3"
                end
            }
            
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            
            # WebSocket 支援 (for hot reload in dev)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Selected-Node $cookie_selected_node;
            
            # 超時設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }
    }
}
