apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-worker
  labels: &id001
    app.kubernetes.io/name: uptime-api
    app.kubernetes.io/instance: uptime-api
    app.kubernetes.io/component: worker
    monitoring.owner: uptime-api-demo-20261114
  namespace: uptime-api
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        monitoring.release-sha: revision
        monitoring.restart: initial
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: *id001
      containers:
      - name: worker
        image: uptime-api:replace-with-immutable-image
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
        - sh
        - -ec
        args:
        - '

          exec node .output/server/index.mjs'
        env:
        - name: NODE_OPTIONS
          value: --max-old-space-size=640
        - name: APP_ROLE
          value: worker
        - name: NODE_ENV
          value: production
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '3000'
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RELEASE_SHA
          value: revision
        envFrom:
        - configMapRef:
            name: uptime-config
        - secretRef:
            name: uptime-api-secret
        ports:
        - name: http
          containerPort: 3000
        startupProbe:
          httpGet:
            path: /api/health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
