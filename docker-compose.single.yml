# Canonical local compose. Required secrets must be set explicitly; no default credentials.
services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: uptime
      POSTGRES_DB: uptime_kuma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uptime -d uptime_kuma]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: uptime-api:local
    command: [node, scripts/migrate.mjs]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set a URL pointing to db:5432/uptime_kuma}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  app:
    image: uptime-api:local
    ports: ["32401:3000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?64 hex characters required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?32 or more characters required}
      NUXT_PUBLIC_APP_URL: http://localhost:32401
      APP_ROLE: all
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    restart: unless-stopped
volumes:
  postgres_data:
